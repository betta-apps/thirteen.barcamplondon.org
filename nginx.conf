# Serves the archive the way WordPress did: /about/ is about/index.html, /about
# redirects to /about/, and anything else is a file or a 404. On jiji, Caddy
# sits in front and Cloudflare does TLS.

map $sent_http_content_type $cache_control {
    ~^text/html  "public, max-age=0, must-revalidate";
    default      "public, max-age=86400";
}

server {
    listen 8080;
    root /srv/site;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;

    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options nosniff;

    # WordPress's own "not found" page, saved with the site.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
